ta no PIX com|2% de desconto no valor em dinheiro"},"retryModal":{"alertImage":{"uid":"blt21ca685ac665d7e6","description":"","filename":"alerta-spot.svg","title":"alerta-spot.svg","updatedAt":"2025-01-28T14:22:18.869Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/blt21ca685ac665d7e6/6798e81a501f0fdfa6571963/alerta-spot.svg"},"titleText":"Instabilidade detectada","descriptionText_1":"Algo não funcionou como esperado.","descriptionText_2":"Recarregar a página geralmente resolve isso rapidinho.","buttonText":"Recarregar agora"},"slider":{"enableTierClub":false},"tags":[],"termsAndConditions":{"checkTermsAndCondition":"Conferir termos e condições","description":"Para informações importantes sobre transferência para o programa {{name}}, leia a aba termos e condições desta página.","embedHtml":"<p style=\"margin-bottom:11px;\">     <span style=\"font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\"><strong>PONTOS IMPORTANTES SOBRE TRANSFERÊNCIA PROGRAMA SMILES (GOL)</strong></span></span> </p> <ul>     <li>         <span style=\"color:#404040;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Para transferir pontos Livelo para o Programa Smiles, você deverá:</span></span>         <ul>             <li>                 <span style=\"color:#404040;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Informar a quantidade de pontos que deseja creditar no Programa Parceiro, em quantidade mínima de 10.000 pontos e múltiplas de 1.000 pontos (ou conforme mencionado na Página do Produto para transferência);</span></span>             </li>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:#404040;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Confirmar a quantidade de Pontos Livelo que serão debitados de sua Conta Livelo;</span></span>             </li>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:#404040;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Clicar sobre o botão “Transfira seus pontos”;</span></span>             </li>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Proceder com o processo de Resgate no Carrinho onde destacamos: a possibilidade de selecionar utilizar Pontos + Dinheiro no&nbsp; Resumo do Carrinho, Revisar seu pedido nas páginas seguintes, e concluir seu resgate através do código de autorização;</span></span>             </li>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\"><strong>Importante:</strong> o limite de transferência para este parceiro é de 999.000 (novecentos e noventa e nove mil) pontos Livelo. O limite ora estabelecido é fixo, independente de quantos Pontos Livelo sejam exigidos para um ponto do parceiro.</span></span>             </li>         </ul>     </li>     <li style=\"text-align:justify;\">         <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Os pontos transferidos serão creditados no Programa Smiles, desde que os dados informados estejam corretos, em:</span></span>         <ul>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Até 2 horas após solicitação de Resgate na Livelo através da opção \"Transferência Imediata\", ou</span></span>             </li>             <li style=\"text-align:justify;\">                 <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Até 1 (um) dia útil após a solicitação de Resgate na Livelo através da opção de transferência regular.</span></span>             </li>         </ul>     </li>     <li style=\"text-align:justify;\">         <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Você deve estar previamente cadastrado (sob o mesmo CPF) no Programa Smiles. Caso ainda não seja cadastrado, cadastre-se pelo </span></span><a style=\"color:blue;text-decoration:underline;\" href=\"https://www.smiles.com.br/cadastro\"><span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">https://www.smiles.com.br/cadastro</span></span></a><span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">.</span></span>     </li>     <li style=\"text-align:justify;\">         <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Sua identificação (CPF conforme cadastro Livelo, Dados Pessoais) para crédito dos pontos transferidos é de responsabilidade do Programa Smiles, que poderá não aceitar a solicitação de crédito encaminhada pela Livelo em seu nome a seu exclusivo critério.</span></span>     </li>     <li style=\"text-align:justify;\">         <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">Se o seu pedido não for processado pelo Programa Smiles, os Pontos serão devolvidos em sua conta Livelo.</span></span>     </li>     <li style=\"text-align:justify;\">         <span style=\"background-color:white;color:black;font-family:Calibri,sans-serif;\"><span style=\"font-size:11pt;line-height:107%;\">A transferência de pontos não poderá ser cancelada, exceto casos comprovados
