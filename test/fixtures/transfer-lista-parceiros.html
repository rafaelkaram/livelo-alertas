description":"","filename":"Logotipo_de_Iberia_1.png","title":"Logotipo_de_Iberia 1.png","updatedAt":"2025-04-18T13:55:49.451Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/blt3b0ab9c17a43abf7/67c9d977a0e0669048d97135/Logotipo_de_Iberia_1.png"},"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/iberia/LIVK0004","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa Iberia Plus","sobreOParceiroDescricao":"Você pode voar para mais de 100 destinos em mais de 1.000 voos diários da Iberia. Além disso, Iberia é parte da aliança One World, com a qual você pode ir a mais de 700 destinos em 150 países ao redor do mundo.\n\nAvios é o ponto em comum da Iberia Plus, British Executive Club e do Programa Avios no Reino Unido. Você pode usar seus pontos Avios em voos, reservas de hotel, aluguel de carro. Além de outras ofertas em mais de 90 parceiros do Programa Iberia Plus.","informacoesImportantesTitulo":"Importante saber:","informacoesImportantesDescricao":"&middot; Certifique-se de que possui uma conta no programa parceiro e os dados estão completos e atualizados.<br>\n&middot; Só serão aceitas transferências para a mesma titularidade.<br>\n&middot; A quantidade mínima de transferência para o programa Iberia Plus é de 1.000 pontos.<br>"},"labelClubGanhaMais":{"labelClub":"","ativo":false},"campanhaAtiva":{"ativa":false,"textoLabel":"Oferta ativa"}},{"skuid":"CPASkuTransfer","Metadata":{"uid":"csb410a361e108e766"},"nomeParceiro":"Copa Airlines","partnerPointsName":"","logo":{"uid":"bltdbbe98ca7deea967","description":"","filename":"connect-miles-logo_1.png","title":"connect-miles-logo 1.png","updatedAt":"2025-04-18T13:55:49.451Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/bltdbbe98ca7deea967/67c9d97902b51262ab21d95a/connect-miles-logo_1.png"},"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/copa/CPATransfer","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa ConnectMiles - Copa Airlines","sobreOParceiroDescricao":"ConnectMiles é o programa de fidelidade da Copa Airlines, uma das principais companhias aéreas das Américas.\n\nCom a Copa Airlines, você pode viajar para mais de 80 destinos em 30 países da América do Norte, América Central, América do Sul e Caribe, através do Hub das Américas®, no Panamá.\n\nA Copa Airlines possui uma das frotas mais novas e modernas da indústria, com Boeing 737-800 NG e Boeing 737 MAX9, e oferece um desempenho de pontualidade superior a 90%, classificando-se entre as melhores da indústria mundial.\n\nAlém disso, a Copa Airlines faz parte da Star Alliance, a maior aliança de companhias aéreas do mundo, o que permite maior flexibilidade e comodidade para você explorar diferentes destinos do mundo todo.","informacoesImportantesTitulo":"O que é importante você saber?","informacoesImportantesDescricao":"&middot; Você já deve ter uma conta neste programa e os seus dados precisam estar completos e atualizados.<br>\n&middot; A transferência de pontos Livelo para milhas da Copa Airlines pode ser realizada apenas entre contas de mesma titularidade.<br>\n&middot; A quantidade mínima de transferência para o programa Copa Airlines é de 1.000 pontos.<br>"},"labelClubGanhaMais":{"labelClub":"","ativo":false},"campanhaAtiva":{"ativa":false,"textoLabel":""}},{"skuid":"K01LIVSKU","Metadata":{"uid":"cs6c3e12f0174951c3"},"nomeParceiro":"MileagePlus","partnerPointsName":"","logo":{"uid":"bltf334d100584b6520","description":"","filename":"United_MileagePlus_logo_1.png","title":"United_MileagePlus_logo 1.png","updatedAt":"2025-04-18T15:00:16.939Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/bltf334d100584b6520/67c9d97cc408d86d121a0cdb/United_MileagePlus_logo_1.png"},"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/milageplus/LIVK0001","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa MileagePlus","sobreOParceiroDescricao":"O Programa de fidelidade que mais dá prêmios no mundo. O MileagePlus é muito mais que um programa de passageiros frequentes — você pode ganhar milhas com suas atividades diárias e usá-las em viagens, experiências, jantares e muito mais. Comece a explorar todas as formas de se beneficiar das suas milhas. Com o programa MileagePlus é possível resgatar voos na United Airlines e também nas 26 aéreas associadas a Star Alliance, incluindo Azul, TAP Portugal, Avianca, Copa Airlines e Singapore Airlines.","informacoesImportantesTitulo":"Importante saber:","informacoesImportantesDescricao":"&middot; Certifique-se de que possui uma conta no programa parceiro e os dados estão completos e atualizados.<br>\n&middot; A transferência só é possível para uma conta com mesma titularidade e mesmos dados pessoais na Mileage Plus da United e na Livelo.<br>\n&middot; A quantidade mínima de transferência para o programa MileagePlus é de 10.000 pontos.<br>"},"labelClubGanhaMais":{"labelClub":"","ativo":false},"campanhaAtiva":{"ativa":false,"textoLabel":""}},{"skuid":"K03LIVSKU","Metadata":{"uid":"csfa865914ed29d5b8"},"nomeParceiro":"British Airways","partnerPointsName":"","logo":{"uid":"blt3e60d4af65555a51","description":"","filename":"British_Airways_Logo_1.png","title":"British_Airways_Logo 1.png","updatedAt":"2025-04-18T13:55:49.451Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/blt3e60d4af65555a51/67c9d97f5f1572a2f27af8b1/British_Airways_Logo_1.png"},"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/british-airways/LIVK0003","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa British Airways Executive Club","sobreOParceiroDescricao":"O programa British Airways Executive Club ajuda a fazer com que sua viagem seja mais gratificante. Além disso, seja membro do programa gratuitamente.\n\nComo membro do programa você acumulará pontos Avios, a moeda do Executive Club, toda vez que viajar com British Airways ou qualquer parceiro da aliança oneworld®, reservar hotéis ou alugar um carro com Avis - ou simplesmente usando o seu cartão de crédito em todas as suas compras. \n\nCom tantas opções de acúmulo, você terá rapidamente a quantidade de Avios necessários para resgatar aquela viagem que você ama, incluindo voos com upgrade de cabine.\n\nBritish Airways é responsável pelo British Airways Executive Club. Avios são resgatados de acordo com os termos e condições do British Executive Club.","informacoesImportantesTitulo":"Importante saber:","informacoesImportantesDescricao":"&middot; Certifique-se de que possui uma conta no programa parceiro e os dados estão completos e atualizados.<br>\n&middot; Só serão aceitas transferências para a mesma titularidade.<br>\n&middot; O resgate de voos e upgrade de cabine estão sujeitos a disponibilidade. Taxas, tarifas, e impostos são aplicáveis.<br>\n&middot; A quantidade mínima de transferência para o programa British Airways é de 10.000 pontos."},"labelClubGanhaMais":{"labelClub":"","ativo":false},"campanhaAtiva":{"ativa":false,"textoLabel":""}},{"skuid":"K07LIVSKU","Metadata":{"uid":"cs4d352aaa657a0392"},"nomeParceiro":"Flying Blue","partnerPointsName":"","logo":null,"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/flying-blue/LIVK0007","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa Flying Blue","sobreOParceiroDescricao":"É fácil desfrutar do programa Flying Blue: você acumula Milhas a cada viagem e pode usá-las para ir sempre mais longe. Um grande número de lojas virtuais lhe permitem ganhar ainda mais Milhas fazendo suas compras pela internet: alimentação, eletrodomésticos, moda... e a lista não para de crescer! Com o Flying Blue, sua fidelidade é recompensada: quanto mais você ganha Milhas, mais você tem acesso aos níveis superiores do programa rapidamente.  Nos Níveis superiores você contará com serviços e benefícios extras. Seja fiel e aproveite cada vez mais vantagens! Você acumula voando AIR FRANCE, KLM ou alguma das companhias aéreas parceiras do programa Flying Blue. Basta indicar o nº de seu cartão Flying Blue no momento da reserva.","informacoesImportantesTitulo":"Importante saber:","informacoesImportantesDescricao":"&middot; Certifique-se de que possui uma conta no programa parceiro e os dados estão completos e atualizados.<br>\n&middot; Só serão aceitas transferências para a mesma titularidade.<br>\n&middot; A quantidade mínima de transferência para o programa Flying Blue é de 10.000 pontos.<br>"},"labelClubGanhaMais":{"labelClub":"","ativo":false},"campanhaAtiva":{"ativa":false,"textoLabel":""}},{"skuid":"K05LIVSKU","Metadata":{"uid":"cs700982570bd15f8c"},"nomeParceiro":"Etihad Guest","partnerPointsName":"","logo":{"uid":"blta33124a98887bee8","description":"","filename":"Etihad-airways-logo_1.png","title":"Etihad-airways-logo 1.png","updatedAt":"2025-04-18T13:55:49.451Z","url":"https://images.contentstack.io/v3/assets/blt2aea50371ca8d246/blta33124a98887bee8/67c9d982fcbce2c95847080a/Etihad-airways-logo_1.png"},"redirectUrl":"https://www.livelo.com.br/livelo-para-parceiros/etihad/LIVK0005","status":"Ativo","informacoesDoParceiro":{"sobreOParceiroTitulo":"Sobre o programa Etihad Guest","sobreOParceiroDescricao":"Eithad Guest abre um mundo de novas oportunidades. Etihad Guest é um programa diferente por ter sido desenvolvido pensando em você. É mais flexível, com menos restrições, e muito mais recompensas. Experimente ver suas recompensas chegarem de forma rápida através de ofertas especiais e poder resgater tanto experiências cotidianas quanto surpreendentes. Na Etihad implementamos nossa visão única da viagem aérea em nosso programa de fidelidade. Etihad Guest acredita que a recompensa correta deve ser planejada desde a primeira experiência do usuário. Aproveite mais benefícios (como acesso a salas VIP e check-in prioritário) quando se tornar Silver, Gold, ou membro Platinum.","informacoesImportantesTitulo":"Importante saber:","informacoesImportantesDescricao":"&
